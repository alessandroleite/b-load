[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-load"
version = "0.1.2"
description = "Background-Knowledge-Augmented Local Causal Discovery"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "b-LOAD contributors" }
]
keywords = [
  "causal discovery",
  "background knowledge",
  "graph learning",
  "statistics",
  "python"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "causal-learn",
  "rpy2",
  "networkx",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/chrisahn99/b-load"
Repository = "https://github.com/chrisahn99/b-load"
Issues = "https://github.com/chrisahn99/b-load/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "bload*"]
